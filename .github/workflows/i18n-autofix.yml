name: i18n autofix

on:
  push:
    branches: [main]
    paths:
      - "hosty/**/*.py"
      - "packaging/linux/*.in"
      - "po/POTFILES"
      - "po/LINGUAS"
      - "po/meson.build"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: i18n-autofix
  cancel-in-progress: false

jobs:
  update-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install polib
      - run: sudo apt-get update -q && sudo apt-get install -y -q meson ninja-build gettext

      - run: meson setup build
      - run: meson compile -C build hosty-update-po
      - run: msgfmt --check po/pl.po -o /dev/null

      - name: Commit template only if source strings changed
        run: |
          python3 - <<'EOF'
          import subprocess, sys, tempfile
          import polib

          def msgids(path):
              return {
                  (e.msgctxt, e.msgid, e.msgid_plural)
                  for e in polib.pofile(path)
                  if e.msgid
              }

          committed_src = subprocess.run(
              ["git", "show", "HEAD:po/hosty.pot"],
              capture_output=True, text=True, check=True,
          ).stdout
          with tempfile.NamedTemporaryFile("w", suffix=".pot", delete=False) as f:
              f.write(committed_src)
              committed_path = f.name

          fresh, committed = msgids("po/hosty.pot"), msgids(committed_path)
          if fresh == committed:
              # Only header dates / #: line numbers moved: drop the churn
              # so po/ stays untouched on plain feature commits.
              subprocess.run(["git", "checkout", "--", "po/"], check=True)
              print(f"no string changes ({len(fresh)} messages), po/ left untouched")
              sys.exit(0)

          for ctx, singular, plural in sorted(fresh - committed):
              print(f"new string: {singular!r}")
          for ctx, singular, plural in sorted(committed - fresh):
              print(f"removed string: {singular!r}")
          print(f"strings changed: {len(committed)} -> {len(fresh)} messages")
          EOF

      - name: Push template update
        run: |
          if git diff --quiet; then
            echo "po/ up to date, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add po/hosty.pot po/*.po
          git commit -m "chore(i18n): update translation template" -m "Auto-generated by i18n autofix. Translators: translate via Weblate."
          git pull --rebase
          git push
