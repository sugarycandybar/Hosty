name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .
      - name: Check version consistency
        run: |
          python3 - <<'EOF'
          import tomllib
          from pathlib import Path

          namespace = {}
          exec(Path("src/hosty/version.py").read_text(encoding="utf-8"), namespace)
          expected = namespace["__version__"]
          actual = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          if actual != expected:
              raise SystemExit(f"pyproject.toml version {actual} != src/hosty/version.py {expected}")
          print(f"version OK: {expected}")
          EOF

  typecheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install mypy requests psutil pillow tomlkit
      - run: mypy src/hosty/ || true

  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 -m compileall src/hosty

  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest polib requests
      - run: sudo apt-get update -q && sudo apt-get install -y -q meson ninja-build gettext desktop-file-utils
      - run: meson setup build
      - run: meson compile -C build
      - name: Check translation file lists
        run: |
          python3 - <<'EOF'
          import re, sys
          from pathlib import Path
          errors = []
          listed = {
              line.strip()
              for line in Path("po/POTFILES.in").read_text(encoding="utf-8").splitlines()
              if line.strip() and not line.strip().startswith("#")
          }
          # Every committed .po must be in LINGUAS (meson only builds those).
          linguas = []
          for line in Path("po/LINGUAS").read_text(encoding="utf-8").splitlines():
              line = line.split("#", 1)[0]
              linguas.extend(t for t in line.replace(",", " ").split() if t.strip())
          for po in sorted(Path("po").glob("*.po")):
              if po.stem not in linguas:
                  errors.append(f"po/{po.name} is not listed in po/LINGUAS, meson will not build it")
          # Every source file using _()/ngettext() must be in POTFILES.
          for py in sorted(Path("src/hosty").rglob("*.py")):
              if "__pycache__" in py.parts or py.name == "i18n.py":
                  continue
              try:
                  src = py.read_text(encoding="utf-8")
              except Exception:
                  continue
              if re.search(r'_\(\s*["\']', src) or "ngettext(" in src:
                  if str(py) not in listed:
                      errors.append(f"{py} uses gettext but is missing from po/POTFILES.in")
          # Desktop/metainfo templates must be listed for string extraction.
          for extra in (
              "data/io.github.sugarycandybar.Hosty.desktop.in",
              "data/io.github.sugarycandybar.Hosty.metainfo.xml.in",
          ):
              if extra not in listed:
                  errors.append(f"{extra} is missing from po/POTFILES.in")
          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)
          print("translation file lists OK")
          EOF
      - run: msgfmt --check po/pl.po -o /dev/null
      - run: python3 -m pytest tests/test_playit_manager.py -q

